name: Windows Governance durability
on:
  push:
    branches: [feat/235-windows-durability-g01-5038b751]
permissions:
  contents: read
jobs:
  windows-durability:
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Probe file and directory durability APIs
        shell: pwsh
        run: ./test-fixtures/governance/windows-directory-flush-probe.ps1
      - name: Test checked Windows admission storage and restart
        shell: pwsh
        run: node --test test/governance/windows-admission-durability.test.js
