name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting. This project is **Alpha** and follows an evidence-first, capability-first design.
        Please read README.md, PROJECT_STATUS.md, CAPABILITY_ROUTING.md, and docs/architecture.md where relevant.
        New complexity should solve a concrete observed problem rather than pre-build a hypothetical agent framework.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What concrete user or orchestration problem does this proposal solve? Include real evidence or a reproducible workflow when available.
    validations:
      required: true

  - type: textarea
    id: capability
    attributes:
      label: Proposed capability
      description: What behavior or interface would you like?
    validations:
      required: true

  - type: textarea
    id: native_first
    attributes:
      label: Existing capability check
      description: Can ChatGPT Native, a connected App, Direct Local, Codex App Server, or an existing project primitive already solve this? Explain why a new project-level capability is still needed.
    validations:
      required: true

  - type: textarea
    id: fit
    attributes:
      label: Why it belongs in this project
      description: How does it fit the ChatGPT-authoritative-Brain / capability-routing / evidence / governance model?
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Architecture impact
      description: What does this primarily affect?
      options:
        - ChatGPT Native / connected-app capability
        - Runtime capability discovery / routing
        - Local MCP / Secure Tunnel
        - Direct Local
        - Codex App Server executor
        - Governance / acceptance / evidence
        - Brain Continuity / durable state / re-entry
        - Mutation ownership / permissions
        - Observability / user experience
        - Released Alpha.3 compatibility
        - Public API / documentation / tooling only
        - Unsure
    validations:
      required: true

  - type: textarea
    id: complexity
    attributes:
      label: Complexity / non-goals
      description: What is the smallest useful version? What should explicitly remain out of scope?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false

  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgement
      description: Please confirm.
      options:
        - label: I understand that a feature request is not a roadmap commitment and may be rejected or deferred if current capabilities already solve the problem.
          required: true
