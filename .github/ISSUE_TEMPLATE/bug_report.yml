name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This project is **Alpha** and currently has both a released Alpha.3 legacy path and a capability-first v0.2 candidate path.
        Please do not include secrets, private repository data, or private conversation contents.

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: What happened? What did you expect to happen?
      placeholder: A clear, concise description of the incorrect behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: The smallest reproducible sequence.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / error
      description: What actually happened. Include logs/error output if useful.
      placeholder: Paste logs/errors here. REDACT secrets, bearer tokens, cookies, API keys, private repository data, and private conversation content.
    validations:
      required: true

  - type: dropdown
    id: runtime_path
    attributes:
      label: Runtime path
      description: Which project path was involved?
      options:
        - "v0.2 candidate: ChatGPT Native / Connected App"
        - "v0.2 candidate: Direct Local via Local MCP"
        - "v0.2 candidate: Codex Delegate via App Server"
        - "v0.2 candidate: Hybrid"
        - "Released Alpha.3 legacy IAB Direct Brain Loop"
        - "Legacy detached worker / TaskService"
        - "Unsure / not applicable"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Relevant component
      description: The area you believe is involved.
      options:
        - Runtime capability discovery / routing
        - Local MCP / Secure Tunnel
        - Governance / acceptance / Brain Continuity
        - Direct Local workspace operation
        - Codex App Server executor / approvals / recovery
        - Mutation ownership / durable state
        - GitHub / connected-app capability
        - Released Alpha.3 IAB / brain-command
        - Legacy detached worker / TaskService
        - Documentation / tooling
        - Unsure / other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.x or 24.x"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Repository commit / version
      placeholder: "v0.1.0-alpha.3 or exact commit SHA"
    validations:
      required: true

  - type: textarea
    id: recovery
    attributes:
      label: Recovery / continuity context
      description: If this involved restart, timeout, re-entry, or duplicate execution, describe the semantic task state. Do not post internal secrets; internal IDs are optional and should be redacted when sensitive.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Anything else that may help.
    validations:
      required: false

  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgement
      description: Please confirm before submitting.
      options:
        - label: I have removed sensitive values (credentials, bearer tokens, cookies, API keys, private repository data, and private conversation content) from this report.
          required: true
        - label: I have identified the runtime path as accurately as I can and have not treated an expected legacy/experimental limitation as a v0.2 correctness claim.
          required: true
